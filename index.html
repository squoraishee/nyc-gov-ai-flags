<title>Protected page</title>
<style>
  :root { --bg: #f7f6f2; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #dcd9d1; --accent: #2a78d6; --err: #b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --panel: #20201e; --ink: #ecebe6; --muted: #a3a29c; --line: #3a3936; --accent: #3987e5; --err: #e66767; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;

  h1 { font-size: 18px; margin: 0 0 4px; }
  p { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
  label { display: block; font-size: 14px; margin-bottom: 6px; }
  input { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { margin-top: 12px; width: 100%; font: inherit; font-weight: 600; padding: 10px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  .err { color: var(--err); font-size: 14px; margin: 10px 0 0; min-height: 1.5em; }
</style>

  var STORE = "nyc-ai-site-key";
  var form = document.getElementById("unlock"), input = document.getElementById("pw");
  var btn = document.getElementById("go"), err = document.getElementById("err");

  function bytes(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }

  async function open(pw) {
    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: bytes(P.salt), iterations: P.iter, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    var zipped = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(P.iv) }, key, bytes(P.ct));
    var stream = new Blob([zipped]).stream().pipeThrough(new DecompressionStream("gzip"));
    return await new Response(stream).text();
  }

  async function unlock(pw, remember) {
    btn.disabled = true; err.textContent = "";
    try {
      var html = await open(pw);
      // Remember the password for this tab so the other pages on the site open without asking again.
      if (remember) { try { sessionStorage.setItem(STORE, pw); } catch (e) {} }
      document.open(); document.write(html); document.close();
      return true;
    } catch (e) {
      try { sessionStorage.removeItem(STORE); } catch (e2) {}
      err.textContent = "That password didn't work.";
      btn.disabled = false; input.select();
      return false;
    }
  }

  form.addEventListener("submit", function (e) { e.preventDefault(); unlock(input.value, true); });

  var url = new URL(location.href), fromUrl = url.searchParams.get("key");
  if (fromUrl !== null) {
    // Take the password out of the address bar so it doesn't get copied along with the link.
    url.searchParams.delete("key");
    history.replaceState(null, "", url.pathname + url.search + url.hash);
    unlock(fromUrl, true);
  } else {
    var saved = null;
    try { saved = sessionStorage.getItem(STORE); } catch (e) {}
    if (saved) unlock(saved, false);
